version: '3.8'

services:
  # 1. PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: syncspace-postgres
    restart: always
    environment:
      POSTGRES_USER: syncspace
      POSTGRES_PASSWORD: syncspace_secure_password_2026
      POSTGRES_DB: syncspace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncspace -d syncspace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Pub/Sub Replication Bus
  redis:
    image: redis:7-alpine
    container_name: syncspace-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. SyncSpace Real-Time WebSocket & CRDT API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syncspace-backend
    restart: always
    environment:
      DATABASE_URL: "postgresql://syncspace:syncspace_secure_password_2026@postgres:5432/syncspace_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      PORT: 5001
      WS_PORT: 1234
      NODE_ENV: production
    ports:
      - "5001:5001"
      - "1234:1234"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. SyncSpace Next.js Collaborative Web Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: syncspace-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5001/api"
      NEXT_PUBLIC_WS_URL: "ws://localhost:1234"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

